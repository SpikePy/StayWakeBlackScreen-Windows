name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Vet
        # -unsafeptr=false: this package's unsafe.Pointer conversions of
        # LPARAM/DIB-section addresses supplied by Win32 (hook callbacks,
        # CreateDIBSection's output buffer) are outside anything the Go
        # object graph tracks, which is inherent to raw Win32 interop, not
        # a bug - vet's static heuristic can't tell that apart from a real
        # misuse.
        run: go vet -unsafeptr=false ./...
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Build StayWakeBlackScreen.exe
        run: go build -ldflags "-H=windowsgui -s -w" -o ../StayWakeBlackScreen.exe ./cmd/staywakeblackscreen
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Build StayWakeBlackScreenIdle.exe
        run: go build -ldflags "-H=windowsgui -s -w" -o ../StayWakeBlackScreenIdle.exe ./cmd/staywakeblackscreenidle
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Build StayWakeInstall.exe
        run: go build -ldflags "-s -w" -o ../StayWakeInstall.exe ./cmd/stay-wake-install
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StayWakeBlackScreen-exe
          path: |
            StayWakeBlackScreen.exe
            StayWakeBlackScreenIdle.exe
            StayWakeInstall.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StayWakeBlackScreen.exe
            StayWakeBlackScreenIdle.exe
            StayWakeInstall.exe
          generate_release_notes: true
